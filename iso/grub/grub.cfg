set timeout=5
set default=0

menuentry "GalactOS Live" {
    linux /boot/vmlinuz boot=live quiet
    initrd /boot/initrd
    boot
}

menuentry "GalactOS Live (debug: kernel messages + serial console)" {
    serial --unit=0 --speed=115200
    terminal_input console serial
    terminal_output console serial
    linux /boot/vmlinuz boot=live console=tty0 console=ttyS0,115200n8
    initrd /boot/initrd
    boot
}
