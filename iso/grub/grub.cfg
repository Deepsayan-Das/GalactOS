serial --unit=0 --speed=115200
terminal_output console serial

set timeout=5
set default=0

menuentry "GalactOS Live" {
    echo "Step 1: about to load kernel"
    linux /boot/vmlinuz boot=live console=ttyS0,115200n8
    echo "Step 2: kernel loaded, about to load initrd"
    initrd /boot/initrd
    echo "Step 3: initrd loaded, about to boot"
    boot
    echo "Step 4: boot command returned (this should never print if boot succeeded)"
}