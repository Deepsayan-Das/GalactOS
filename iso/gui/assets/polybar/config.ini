[colors]
bg = #E63a4556
fg = #EDE9F3
accent = #DCCCEC
blue = #BCD8EC
green = #D6E5BD
yellow = #F9E1A8
pink = #FFCBE1
dim = #8f95a3

[bar/main]
width = 100%
height = 34
radius = 0
background = ${colors.bg}
foreground = ${colors.fg}
font-0 = JetBrains Mono:size=10;2
font-1 = FontAwesome:size=11;2
padding = 2
module-margin = 2
modules-left = battery time volume
modules-center = date
modules-right = sidebar

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
low-at = 10
poll-interval = 5

format-charging = <label-charging>
label-charging = 
label-charging-foreground = ${colors.green}

format-discharging = <ramp-capacity>
format-full = <ramp-capacity>
format-low = <ramp-capacity>

ramp-capacity-0 = %{F#FFCBE1}%{F-}
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

[module/time]
type = internal/date
interval = 5
time = %H:%M
label = %time%

[module/date]
type = internal/date
interval = 60
date = %A, %d %B
label = %date%

[module/volume]
type = internal/alsa
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
format-muted = <label-muted>
label-muted =  muted
label-muted-foreground = ${colors.dim}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

[module/sidebar]
type = custom/text
content = 
content-foreground = ${colors.accent}
click-left = rofi -show drun
